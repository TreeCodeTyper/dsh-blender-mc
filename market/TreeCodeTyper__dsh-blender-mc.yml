url: https://github.com/TreeCodeTyper/dsh-blender-mc
name: TreeCodeTyper/dsh-blender-mc
category: tools
description:
  en: 'Turns a Minecraft Java save into a Blender cover or a short clip. Upload the save as a .zip in settings: it unpacks the archive, walks nested folders to find the actual world, and understands both the classic region/ layout and the 26.x dimensions/<namespace>/<dimension>/region layout; skin PNGs (64-512 px) are uploaded the same way. It then scans the .mca region files for flat open ground, scores camera azimuths against terrain elevation and sun direction (an azimuth staring into a cliff is rejected outright), exports the terrain to OBJ and drives Blender headless with MCprep materials, the BPS character rig, three-point lighting re-aimed from the camera, AgX color management and a compositor grade. After every render it reviews the frame with OpenCV for facing, ground contact, exposure, lighting, depth of field, framing, rim light and sky gradient, then re-renders with corrected parameters when a check fails. The same scene build renders 10-second animations and multi-shot storyboard films from JSON motion recipes. Requires Blender 4.2 LTS or newer and Python 3.10+ with opencv-python and numpy; the bundled setup command assembles the Minecraft assets on first run.'
  zh: '把 Minecraft Java 存档变成 Blender 封面或短片。存档压成 .zip 在设置页上传：自动解压、逐层找出嵌套的存档目录，同时支持经典的 region/ 布局与 26.x 的 dimensions/<命名空间>/<维度>/region 布局；皮肤 PNG（64–512）同样在这里上传，新上传的自动设为默认。随后在 .mca 区域文件里找成片平地，用「地形仰角 + 太阳方向」给视线方位打分（正对土崖的方位直接出局），导出地形为 OBJ，无头驱动 Blender：MCprep 材质、BPS 角色骨架、按相机方向重摆的三点布光、AgX 色彩管理与合成器后期。每次渲染后用 OpenCV 检查朝向、接地、曝光、布光、景深、构图、轮廓光与天空梯度，不合格就调整参数重渲。同一套场景也能出 10 秒动画，或按 JSON 动作配方出多镜头分镜片。需 Blender 4.2 LTS 以上、Python 3.10+（opencv-python、numpy），首次使用运行自带 setup 装配 Minecraft 素材。'
